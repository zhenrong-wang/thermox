services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thermox
      POSTGRES_USER: thermox
      POSTGRES_PASSWORD: thermox-local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermox -d thermox"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - thermox-postgres-data:/var/lib/postgresql/data
      - ../adapters/postgres/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  thermox-postgres-data:
