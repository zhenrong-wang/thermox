name: thermox-object-storage

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thermox-minio
      MINIO_ROOT_PASSWORD: thermox-minio-local
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:9000/minio/health/live
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - thermox-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: thermox-minio
      MINIO_ROOT_PASSWORD: thermox-minio-local
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/thermox-results
        mc anonymous set none local/thermox-results
        exec tail -f /dev/null
    healthcheck:
      test:
        - CMD
        - mc
        - stat
        - local/thermox-results
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  thermox-minio-data:
